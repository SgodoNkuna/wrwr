name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VITE_SUPABASE_URL: https://cydcyotvlgqlveoegcpt.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_fH-qxYxeXAV7uGYyUxRRLw_RuRDZRlC

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end + accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview server
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 http://localhost:4173 --timeout 30000
      - run: node e2e/run.mjs http://localhost:4173 e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          retention-days: 14

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VITE_SUPABASE_URL --build-arg VITE_SUPABASE_ANON_KEY -t tshehla-agrihub .
      - run: |
          docker run -d --name web -p 8080:8080 tshehla-agrihub
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs -A 'WhatsApp/2.0' http://localhost:8080/products/broiler-chicks | grep -q 'og:title'
